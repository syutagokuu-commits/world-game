<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フィリピン探検！ワールドアドベンチャー（全13問）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap');
        body { font-family: 'M PLUS Rounded 1c', sans-serif; touch-action: manipulation; user-select: none; }
        canvas { image-rendering: pixelated; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <div class="w-full max-w-4xl bg-gray-800 rounded-3xl p-4 shadow-2xl border-4 border-yellow-400 relative">
        <div class="flex justify-between items-center mb-2 px-2 text-sm sm:text-base">
            <div class="flex items-center gap-2">
                <span class="bg-blue-600 text-white font-extrabold px-3 py-1 rounded-full text-xs sm:text-sm" id="stage-badge">STAGE 1/13</span>
                <span class="font-bold text-yellow-300" id="country-title">🇵🇭 フィリピンを知ろう</span>
            </div>
            <div class="flex items-center gap-4 font-bold">
                <span class="text-blue-400"><i class="fa-solid fa-circle-check me-1"></i> 正解: <span id="correct-count">0</span> / 13</span>
                <span class="text-yellow-400"><i class="fa-solid fa-star me-1"></i> SCORE: <span id="score-val">0</span></span>
            </div>
        </div>

        <div class="relative w-full aspect-[16/9] bg-black rounded-2xl overflow-hidden border-2 border-gray-700">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <div id="start-overlay" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-6 text-center z-10">
                <div class="text-6xl mb-3 animate-bounce">🇵🇭</div>
                <h1 class="text-2xl sm:text-4xl font-extrabold text-yellow-300 mb-2">フィリピン探検クイズ！</h1>
                <p class="text-xs sm:text-sm text-gray-300 mb-6 max-w-md">
                    キャラクターを操作して正解の扉（A/B/C）に入ろう！<br>
                    全13問のクイズに挑戦！間違えても最後まで進めるよ！（所要時間：約5〜7分）
                </p>
                <button onclick="startGame()" class="px-8 py-4 bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-extrabold text-lg sm:text-xl rounded-2xl shadow-lg border-2 border-blue-500 transform active:scale-95 transition-all">
                    冒険をはじめる！ <i class="fa-solid fa-play ms-2"></i>
                </button>
            </div>

            <div id="result-overlay" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-6 text-center z-10">
                <i id="result-icon" class="fa-solid fa-trophy text-6xl text-yellow-400 mb-3"></i>
                <h2 id="result-title" class="text-3xl font-extrabold text-white mb-2">ゴール！全13問クリア！</h2>
                <p id="result-msg" class="text-gray-300 mb-6 text-sm">フィリピン物知りマスターになりました！</p>
                <button onclick="restartGame()" class="px-6 py-3 bg-yellow-400 text-gray-900 font-extrabold text-lg rounded-2xl shadow-lg border-2 border-blue-500 transform active:scale-95 transition-all">
                    もう一度あそぶ <i class="fa-solid fa-rotate-right ms-1"></i>
                </button>
            </div>
        </div>

        <div class="mt-4 grid grid-cols-3 gap-2 sm:hidden">
            <button id="btn-left" class="bg-gray-700 active:bg-yellow-500 py-4 rounded-xl text-2xl font-bold border-b-4 border-gray-900 active:border-yellow-700"><i class="fa-solid fa-arrow-left"></i></button>
            <button id="btn-jump" class="bg-yellow-500 active:bg-yellow-400 text-gray-900 py-4 rounded-xl text-2xl font-bold border-b-4 border-yellow-700">JUMP <i class="fa-solid fa-arrow-up ms-1"></i></button>
            <button id="btn-right" class="bg-gray-700 active:bg-yellow-500 py-4 rounded-xl text-2xl font-bold border-b-4 border-gray-900 active:border-yellow-700"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800; canvas.height = 450;

        // 正解位置：C, B, A, C, A, B, C, A, B, C, A, B, C に分散
        const stages = [
            { theme: "🏛️ 首都の知識", question: "【第1問】フィリピンの首都の名前は？", options: [{ label: "A", text: "セブ", correct: false }, { label: "B", text: "ダバオ", correct: false }, { label: "C", text: "マニラ", correct: true }], explanation: "正解はCのマニラ！歴史的な街並みや商業施設が広がる大都市だよ！" },
            { theme: "🏝️ 島々の国", question: "【第2問】フィリピンは約いくつの島からできている？", options: [{ label: "A", text: "約700の島", correct: false }, { label: "B", text: "約7,600の島", correct: true }, { label: "C", text: "約70,000の島", correct: false }], explanation: "正解はBの約7,600の島！太平洋に浮かぶ南国の島国なんだよ！" },
            { theme: "💬 言語と挨拶", question: "【第3問】タガログ語で「こんにちは」を表す言葉は？", options: [{ label: "A", text: "カムスタ", correct: true }, { label: "B", text: "サワディー", correct: false }, { label: "C", text: "アロハ", correct: false }], explanation: "正解はAのカムスタ（Kamusta）！親しい間柄でよく使われる挨拶だよ！" },
            { theme: "🍨 伝統スイーツ", question: "【第4問】「まぜこぜ」という意味を持つ、フィリピンの有名にかき氷デザートは？", options: [{ label: "A", text: "タピオカ", correct: false }, { label: "B", text: "パフェ", correct: false }, { label: "C", text: "ハロハロ", correct: true }], explanation: "正解はCのハロハロ！ウベ（紫芋）アイスやゼリーなどを混ぜて食べるよ！" },
            { theme: "🚌 乗り物", question: "【第5問】ジープを改造した、フィリピンのカラフルな乗合バスの呼び名は？", options: [{ label: "A", text: "ジプニー", correct: true }, { label: "B", text: "トゥクトゥク", correct: false }, { label: "C", text: "トラム", correct: false }], explanation: "正解はAのジプニー！派手なペイントがほどこされた街の重要な移動手段だよ！" },
            { theme: "🍍 果物の王国", question: "【第6問】フィリピンが日本へたくさん輸出している、代表的な南国フルーツは？", options: [{ label: "A", text: "リンゴ", correct: false }, { label: "B", text: "バナナ / マンゴー", correct: true }, { label: "C", text: "ミカン", correct: false }], explanation: "正解はBのバナナやマンゴー！とても甘くて美味しいフルーツがたくさん収穫できるよ！" },
            { theme: "⛰️ 自然の絶景", question: "【第7問】ボホール島にある、乾季になるとブラウンチョコ色になる丘群は？", options: [{ label: "A", text: "キャンディ山", correct: false }, { label: "B", text: "ビスケット丘", correct: false }, { label: "C", text: "チョコレート・ヒルズ", correct: true }], explanation: "正解はCのチョコレート・ヒルズ！1,000個以上の丘が並ぶ自然の奇跡だよ！" },
            { theme: "🌾 世界遺産", question: "【第8問】「天国への階段」とも呼ばれるルソン島の有名な世界遺産は？", options: [{ label: "A", text: "コルディリェーラの棚田", correct: true }, { label: "B", text: "万里の長城", correct: false }, { label: "C", text: "マチュピチュ", correct: false }], explanation: "正解はAの棚田！山岳民族が2000年以上かけて作った壮大な段々畑だよ！" },
            { theme: "🦅 国の鳥", question: "【第9問】フィリピンの国鳥で、世界最大級の大きさを誇るワシは？", options: [{ label: "A", text: "ハクトウワシ", correct: false }, { label: "B", text: "フィリピンワシ", correct: true }, { label: "C", text: "オオワシ", correct: false }], explanation: "正解はBのフィリピンワシ！翼を広げると2メートル以上にもなる力強い鳥だよ！" },
            { theme: "🥋 国技・スポーツ", question: "【第10問】竹の棒を使って戦う、フィリピンの伝統的な国技（武術）は？", options: [{ label: "A", text: "フェンシング", correct: false }, { label: "B", text: "剣道", correct: false }, { label: "C", text: "アーニス", correct: true }], explanation: "正解はCのアーニス！スティック（棒）を使って素早く攻撃や防御を行う伝統武術だよ！" },
            { theme: "🪙 お金の単位", question: "【第11問】フィリピンで使われている通貨（お金の単位）の名前は？", options: [{ label: "A", text: "ペソ", correct: true }, { label: "B", text: "ドル", correct: false }, { label: "C", text: "ユーロ", correct: false }], explanation: "正解はAのフィリピン・ペソ！記号は「₱」と表記されるよ！" },
            { theme: "👕 伝統衣装", question: "【第12問】パイナップルの葉の繊維から作られる、フィリピンの男性用正装シャツは？", options: [{ label: "A", text: "アロハシャツ", correct: false }, { label: "B", text: "バロン・タガログ", correct: true }, { label: "C", text: "Tシャツ", correct: false }], explanation: "正解はBのバロン・タガログ！透け感のある涼しい生地で作られた美しい正装だよ！" },
            { theme: "🐒 世界最小の霊長類", question: "【第13問】ボホール島などに生息する、手のひらサイズで目が大きいサルの名前は？", options: [{ label: "A", text: "チンパンジー", correct: false }, { label: "B", text: "リスザル", correct: false }, { label: "C", text: "メガネザル", correct: true }], explanation: "正解はCのメガネザル！体長10cmほどで大きな目が特徴の愛くるしい保護動物だよ！" }
        ];

        let currentStageIdx = 0, score = 0, correctAnswers = 0, gameState = 'START';
        const player = { x: 80, y: 280, width: 32, height: 48, vx: 0, vy: 0, speed: 5, jumpPower: -12, gravity: 0.6, isGrounded: false, direction: 'right' };
        const keys = { left: false, right: false, up: false };
        const doors = [{ label: 'A', x: 220, y: 260, width: 50, height: 70 }, { label: 'B', x: 420, y: 260, width: 50, height: 70 }, { label: 'C', x: 620, y: 260, width: 50, height: 70 }];
        let expText = "", expTimer = 0;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') { keys.up = true; handleEnterDoor(); }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.up = false;
        });

        document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
        document.getElementById('btn-left').addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
        document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
        document.getElementById('btn-right').addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
        document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); keys.up = true; handleEnterDoor(); });
        document.getElementById('btn-jump').addEventListener('touchend', (e) => { e.preventDefault(); keys.up = false; });

        function startGame() { document.getElementById('start-overlay').classList.add('hidden'); document.getElementById('result-overlay').classList.add('hidden'); currentStageIdx = 0; score = 0; correctAnswers = 0; resetPlayerPos(); gameState = 'PLAYING'; updateUI(); }
        function restartGame() { startGame(); }
        function resetPlayerPos() { player.x = 80; player.y = 280; player.vx = 0; player.vy = 0; }
        function updateUI() { document.getElementById('stage-badge').innerText = `STAGE ${currentStageIdx + 1}/${stages.length}`; document.getElementById('country-title').innerText = stages[currentStageIdx].theme; document.getElementById('correct-count').innerText = correctAnswers; document.getElementById('score-val').innerText = score; }

        function handleEnterDoor() {
            if (gameState !== 'PLAYING') return;
            const currentStage = stages[currentStageIdx];
            doors.forEach((door, idx) => {
                if (player.x + player.width > door.x && player.x < door.x + door.width) {
                    const selectedOpt = currentStage.options[idx];
                    if (selectedOpt.correct) { score += 100; correctAnswers++; expText = "⭕️ 正解！ " + currentStage.explanation; }
                    else { expText = "❌ おしい！ " + currentStage.explanation; }
                    gameState = 'EXPLANATION'; expTimer = 170; updateUI();
                }
            });
        }

        function update() {
            if (gameState !== 'PLAYING') return;
            if (keys.left) { player.vx = -player.speed; player.direction = 'left'; }
            else if (keys.right) { player.vx = player.speed; player.direction = 'right'; }
            else player.vx = 0;

            if (keys.up && player.isGrounded) { player.vy = player.jumpPower; player.isGrounded = false; }
            player.vy += player.gravity; player.x += player.vx; player.y += player.vy;
            if (player.y + player.height >= 330) { player.y = 330 - player.height; player.vy = 0; player.isGrounded = true; }
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        }

        function draw() {
            ctx.fillStyle = '#0284c7'; ctx.fillRect(0, 0, canvas.width, 330);
            ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(720, 60, 35, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(100, 80, 25, 0, Math.PI * 2); ctx.arc(125, 70, 30, 0, Math.PI * 2); ctx.arc(150, 80, 25, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fef08a'; ctx.fillRect(0, 330, canvas.width, 15); ctx.fillStyle = '#d97706'; ctx.fillRect(0, 345, canvas.width, 105);

            const stage = stages[currentStageIdx];
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(20, 15, canvas.width - 40, 75);
            ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3; ctx.strokeRect(20, 15, canvas.width - 40, 75);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 17px "M PLUS Rounded 1c"'; ctx.textAlign = 'center'; ctx.fillText(stage.question, canvas.width / 2, 58);

            doors.forEach((door, idx) => {
                const opt = stage.options[idx];
                ctx.fillStyle = '#0369a1'; ctx.fillRect(door.x, door.y, door.width, door.height);
                ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3; ctx.strokeRect(door.x, door.y, door.width, door.height);
                ctx.fillStyle = '#facc15'; ctx.font = 'bold 24px "M PLUS Rounded 1c"'; ctx.fillText(door.label, door.x + door.width / 2, door.y - 10);
                ctx.fillStyle = '#ffffff'; ctx.fillRect(door.x - 48, door.y - 65, 146, 45);
                ctx.fillStyle = '#1f2937'; ctx.font = 'bold 12px "M PLUS Rounded 1c"'; ctx.fillText(opt.text, door.x + 25, door.y - 38);
            });

            ctx.fillStyle = '#eab308'; ctx.fillRect(player.x, player.y + 16, player.width, 32);
            ctx.fillStyle = '#fca5a5'; ctx.fillRect(player.x + 4, player.y, 24, 20);
            ctx.fillStyle = '#2563eb'; ctx.fillRect(player.x, player.y - 4, 32, 10);

            if (gameState === 'EXPLANATION') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.9)'; ctx.fillRect(30, 110, canvas.width - 60, 210);
                ctx.strokeStyle = '#facc15'; ctx.lineWidth = 4; ctx.strokeRect(30, 110, canvas.width - 60, 210);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 17px "M PLUS Rounded 1c"'; ctx.fillText(expText, canvas.width / 2, 195);
                ctx.fillStyle = '#7dd3fc'; ctx.font = 'bold 14px "M PLUS Rounded 1c"'; ctx.fillText("次のステージへ向かっています...", canvas.width / 2, 270);
                expTimer--;
                if (expTimer <= 0) {
                    if (currentStageIdx + 1 < stages.length) { currentStageIdx++; resetPlayerPos(); gameState = 'PLAYING'; updateUI(); }
                    else endGame();
                }
            }
        }

        function endGame() {
            gameState = 'CLEAR';
            const overlay = document.getElementById('result-overlay');
            document.getElementById('result-title').innerText = "全13問ゴール！";
            document.getElementById('result-msg').innerText = `おつかれさまでした！ 13問中 ${correctAnswers} 問正解！（スコア: ${score}点）`;
            overlay.classList.remove('hidden');
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
